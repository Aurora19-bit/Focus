name: Build FocusLock APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Add missing resources
        run: |
          R=app/src/main/res
          mkdir -p $R/anim
          cat > $R/anim/butterfly_float.xml <<'EOF2'
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:interpolator="@android:anim/linear_interpolator">
              <translate android:fromXDelta="0" android:toXDelta="10dp" android:fromYDelta="0" android:toYDelta="-15dp" android:duration="1200" android:repeatMode="reverse" android:repeatCount="infinite" />
          </set>
          EOF2
          cat > $R/anim/sparkle_pulse.xml <<'EOF2'
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <scale android:fromXScale="0.8" android:toXScale="1.2" android:fromYScale="0.8" android:toYScale="1.2" android:pivotX="50%" android:pivotY="50%" android:duration="800" android:repeatMode="reverse" android:repeatCount="infinite" />
          </set>
          EOF2
          cat > $R/anim/plant_breeze.xml <<'EOF2'
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <rotate android:fromDegrees="-3" android:toDegrees="3" android:pivotX="50%" android:pivotY="100%" android:duration="1500" android:repeatMode="reverse" android:repeatCount="infinite" />
          </set>
          EOF2
          mkdir -p $R/drawable $R/mipmap-anydpi-v26 $R/values
          cat > $R/drawable/ic_launcher_foreground.xml <<'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M38,48h32v26h-32z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="5" android:pathData="M44,48v-8a10,10 0 0,1 20,0v8"/>
          </vector>
          EOF2
          for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml <<'EOF2'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/emerald_dark"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF2
          done

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
