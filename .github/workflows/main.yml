name: Build FocusLock APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Write Gradle config
        run: |
          cat > settings.gradle.kts <<'EOF2'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FocusLock"
          include(":app")
          EOF2
          cat > build.gradle.kts <<'EOF2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF2
          cat > gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF2'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vidhya.focuslock"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vidhya.focuslock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "3.0.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
                  debug { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF2

      - name: Put project files in the right folders
        run: |
          M=app/src/main
          R=$M/res
          J=$M/java/com/vidhya/focuslock
          mkdir -p $J $R/layout $R/drawable $R/xml $R/values
          pick() { find . -type f -name "$1" -not -path "./.git/*" -not -path "./app/src/*" -not -path "./app/build/*" -exec cp -v {} "$2" \; ; }
          pick "*.kt" $J/
          pick "activity_*.xml" $R/layout/
          pick "item_*.xml" $R/layout/
          pick "bg_*.xml" $R/drawable/
          pick "accessibility_service_config.xml" $R/xml/
          pick "device_admin_receiver.xml" $R/xml/
          pick "colors.xml" $R/values/
          pick "strings.xml" $R/values/
          pick "themes.xml" $R/values/
          pick "AndroidManifest.xml" $M/
          pick "proguard-rules.pro" app/
          [ -f $R/drawable/ic_launcher.xml ] || pick "ic_launcher.xml" $R/drawable/
          [ -f $R/values/colors.xml ] || cat > $R/values/colors.xml <<'EOF2'
          <resources>
              <color name="white">#FFFFFFFF</color>
              <color name="emerald_primary">#10B981</color>
              <color name="emerald_dark">#047857</color>
              <color name="bg_dark">#0F172A</color>
          </resources>
          EOF2
          [ -f $R/values/strings.xml ] || echo '<resources><string name="app_name">FocusLock</string></resources>' > $R/values/strings.xml
          [ -f $R/values/themes.xml ] || cat > $R/values/themes.xml <<'EOF2'
          <resources>
              <style name="Theme.FocusLock" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/emerald_primary</item>
                  <item name="colorSecondary">@color/emerald_primary</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
              </style>
              <style name="Theme.FocusLock.Fullscreen" parent="Theme.FocusLock"><item name="android:windowFullscreen">true</item></style>
              <style name="Theme.FocusLock.Dialog" parent="Theme.MaterialComponents.DayNight.Dialog" />
          </resources>
          EOF2
          echo "=== Project files ==="
          find app -type f -not -path "app/build/*" | sort

      - name: Add missing resources
        run: |
          R=app/src/main/res
          mkdir -p $R/anim
          cat > $R/anim/butterfly_float.xml <<'EOF2'
          <set xmlns:android="http://schemas.android.com/apk/res/android" android:interpolator="@android:anim/linear_interpolator">
              <translate android:fromXDelta="0" android:toXDelta="10dp" android:fromYDelta="0" android:toYDelta="-15dp" android:duration="1200" android:repeatMode="reverse" android:repeatCount="infinite" />
          </set>
          EOF2
          cat > $R/anim/sparkle_pulse.xml <<'EOF2'
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <scale android:fromXScale="0.8" android:toXScale="1.2" android:fromYScale="0.8" android:toYScale="1.2" android:pivotX="50%" android:pivotY="50%" android:duration="800" android:repeatMode="reverse" android:repeatCount="infinite" />
          </set>
          EOF2
          cat > $R/anim/plant_breeze.xml <<'EOF2'
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <rotate android:fromDegrees="-3" android:toDegrees="3" android:pivotX="50%" android:pivotY="100%" android:duration="1500" android:repeatMode="reverse" android:repeatCount="infinite" />
          </set>
          EOF2
          mkdir -p $R/drawable $R/mipmap-anydpi-v26 $R/values
          cat > $R/drawable/ic_launcher_foreground.xml <<'EOF2'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M38,48h32v26h-32z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="5" android:pathData="M44,48v-8a10,10 0 0,1 20,0v8"/>
          </vector>
          EOF2
          for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml <<'EOF2'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/emerald_dark"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF2
          done

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          
