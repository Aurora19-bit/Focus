name: Build FocusLock Deep Ocean Sanctuary APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Complete Deep Ocean Sanctuary Project
        run: python3 generate.py

      - name: Build Ocean Sanctuary APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Ocean Sanctuary APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.6.0-DeepOceanSanctuary-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
